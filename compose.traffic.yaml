name: support-bridge-traffic

# This overlay uses its own project, data, credentials and host ports.
services:
  api:
    ports: !override
      - "127.0.0.1:${BRIDGE_TRAFFIC_HTTP_PORT:-8081}:8080"

  worker:
    environment:
      BRIDGE_SWEEP_INTERVAL: "5"

  prometheus:
    ports: !override
      - "127.0.0.1:${BRIDGE_TRAFFIC_PROMETHEUS_PORT:-9091}:9090"

  grafana:
    ports: !override
      - "127.0.0.1:${BRIDGE_TRAFFIC_GRAFANA_PORT:-3001}:3000"

  traffic:
    image: support-bridge:local
    build:
      context: .
      target: runtime
    init: true
    read_only: true
    user: "10001:10001"
    working_dir: /app
    command: [traffic]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m
    environment:
      BRIDGE_MODE: local
      BRIDGE_HOME: /var/lib/support-bridge
      BRIDGE_API_TOKEN_FILE: /run/secrets/operator/token
      BRIDGE_TRAFFIC_ENABLED: "1"
      BRIDGE_TRAFFIC_INTERVAL: "${BRIDGE_TRAFFIC_INTERVAL:-5}"
      BRIDGE_TRAFFIC_RANDOM_MIN: "${BRIDGE_TRAFFIC_RANDOM_MIN:-1}"
      BRIDGE_TRAFFIC_RANDOM_MAX: "${BRIDGE_TRAFFIC_RANDOM_MAX:-5}"
      BRIDGE_TRAFFIC_REVIEW: "${BRIDGE_TRAFFIC_REVIEW:-scripted}"
    restart: unless-stopped
    stop_grace_period: 15s
    depends_on:
      api:
        condition: service_healthy
      worker:
        condition: service_healthy
    volumes:
      - app-data:/var/lib/support-bridge
      - operator-secret:/run/secrets/operator:ro
    healthcheck:
      test: [CMD, php, /app/docker/healthcheck.php, traffic]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 20s
    networks: [stack]
