version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
      time: '08:00'
      timezone: UTC
    open-pull-requests-limit: 10
    cooldown:
      default-days: 1
      exclude: ['*']
    groups:
      github-actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /tools/api-docs
    schedule:
      interval: daily
      time: '08:00'
      timezone: UTC
    open-pull-requests-limit: 10
    cooldown:
      default-days: 1
      exclude: ['*']
    groups:
      api-security:
        applies-to: security-updates
        patterns: ['*']
      api-tooling:
        applies-to: version-updates
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories: ['/', '/docker', '/tools/security']
    schedule:
      interval: daily
      time: '08:00'
      timezone: UTC
    open-pull-requests-limit: 10
    cooldown:
      default-days: 1
      exclude: ['*']
    allow:
      - dependency-name: php
      - dependency-name: node
      - dependency-name: prom/prometheus
      - dependency-name: grafana/grafana
      - dependency-name: ghcr.io/aquasecurity/trivy
