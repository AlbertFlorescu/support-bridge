name: Verify

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install PHP CLI extensions
        run: sudo apt-get update -qq && sudo apt-get install -y php-cli php-sqlite3 php-curl
      - name: Lint, test, and run offline demo
        run: php bin/check.php
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tools/api-docs/package-lock.json
      - name: Test vulnerability reporting and safe asset repair
        run: python3 -m unittest discover -s tools/security -p 'test_*.py' -v
      - name: Validate OpenAPI and actual HTTP response fixtures
        working-directory: tools/api-docs
        run: npm ci --ignore-scripts --no-audit --no-fund && node check-vendor.cjs && node validate.cjs
      - name: Retain synthetic API response fixtures
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-response-fixtures
          path: var/api-contract-fixtures.json
          if-no-files-found: ignore
          retention-days: 7

  containers:
    name: Container checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: support-bridge-ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run PHP and OpenAPI verification inside Docker
        run: docker compose --profile test run --build --rm verify
      - name: Start the complete local stack
        run: docker compose up --build -d --wait --wait-timeout 120
      - name: Verify actual API, scrape and dashboard behavior
        run: docker compose --profile test run --rm smoke
      - name: Verify pending approvals and credentials survive recreation
        run: sh docker/check-lifecycle.sh
      - name: Show container diagnostics
        if: failure()
        run: docker compose ps -a && docker compose logs --no-color --tail=100
      - name: Remove disposable CI services and volumes
        if: always()
        run: docker compose down --volumes --remove-orphans

  required:
    name: Required checks
    if: ${{ always() }}
    needs: [php, containers]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    env:
      PHP_RESULT: ${{ needs.php.result }}
      CONTAINER_RESULT: ${{ needs.containers.result }}
    steps:
      - name: Require every verification job to succeed
        run: |
          printf '| Check | Result |\n| --- | --- |\n| PHP | %s |\n| Containers | %s |\n' "$PHP_RESULT" "$CONTAINER_RESULT" >> "$GITHUB_STEP_SUMMARY"
          if [ "$PHP_RESULT" != success ] || [ "$CONTAINER_RESULT" != success ]; then
            echo 'Every verification job must succeed; failed, cancelled and skipped jobs cannot pass this gate.' >&2
            exit 1
          fi
          echo 'All required verification jobs succeeded.'
