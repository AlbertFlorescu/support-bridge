name: support-bridge

x-hardening: &hardening
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs:
    - /tmp:rw,nosuid,nodev,size=64m

x-runtime: &runtime
  <<: *hardening
  image: support-bridge:local
  build:
    context: .
    target: runtime
  user: "10001:10001"
  working_dir: /app

x-application-environment: &application-environment
  BRIDGE_MODE: local
  BRIDGE_HOME: /var/lib/support-bridge

services:
  init:
    <<: *runtime
    command: [init]
    environment: *application-environment
    restart: "no"
    volumes:
      - app-data:/var/lib/support-bridge
      - operator-secret:/run/secrets/operator
      - metrics-secret:/run/secrets/metrics
      - grafana-secret:/run/secrets/grafana
    networks: [stack]

  api:
    <<: *runtime
    command: [api]
    environment:
      <<: *application-environment
      BRIDGE_API_TOKEN_FILE: /run/secrets/operator/token
      BRIDGE_METRICS_TOKEN_FILE: /run/secrets/metrics/token
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${BRIDGE_HTTP_PORT:-1988}:8080"
    volumes:
      - app-data:/var/lib/support-bridge
      - operator-secret:/run/secrets/operator:ro
      - metrics-secret:/run/secrets/metrics:ro
    healthcheck:
      test: [CMD, php, /app/docker/healthcheck.php, api]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 10s
    networks: [stack]

  worker:
    <<: *runtime
    command: [worker]
    environment:
      <<: *application-environment
      BRIDGE_SWEEP_INTERVAL: "${BRIDGE_SWEEP_INTERVAL:-60}"
    restart: unless-stopped
    stop_grace_period: 15s
    depends_on:
      init:
        condition: service_completed_successfully
    volumes:
      - app-data:/var/lib/support-bridge
    healthcheck:
      test: [CMD, php, /app/docker/healthcheck.php, worker]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s
    networks: [stack]

  prometheus:
    <<: *hardening
    image: support-bridge-prometheus:local
    build:
      context: .
      dockerfile: docker/prometheus.Dockerfile
    user: "65534:65534"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.listen-address=0.0.0.0:9090
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${BRIDGE_PROMETHEUS_PORT:-1989}:9090"
    volumes:
      - prometheus-data:/prometheus
      - metrics-secret:/run/secrets/metrics:ro
    healthcheck:
      test: [CMD, /bin/wget, -q, -O, /dev/null, "http://127.0.0.1:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks: [stack]

  grafana:
    <<: *hardening
    image: support-bridge-grafana:local
    build:
      context: .
      dockerfile: docker/grafana.Dockerfile
    user: "472:472"
    environment:
      GF_AUTH_LOGIN_COOKIE_NAME: "${COMPOSE_PROJECT_NAME}_grafana_session"
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana/password
      GF_SECURITY_SECRET_KEY__FILE: /run/secrets/grafana/secret-key
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully
      prometheus:
        condition: service_healthy
    ports:
      - "127.0.0.1:${BRIDGE_GRAFANA_PORT:-1990}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - grafana-secret:/run/secrets/grafana:ro
      - metrics-secret:/run/secrets/metrics:ro
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
    networks: [stack]

  cli:
    <<: *runtime
    profiles: [tools]
    entrypoint: [php, /app/docker/entrypoint.php, cli]
    command: [status]
    environment:
      <<: *application-environment
      BRIDGE_API_TOKEN_FILE: /run/secrets/operator/token
      BRIDGE_METRICS_TOKEN_FILE: /run/secrets/metrics/token
    depends_on:
      init:
        condition: service_completed_successfully
    volumes:
      - app-data:/var/lib/support-bridge
      - operator-secret:/run/secrets/operator:ro
      - metrics-secret:/run/secrets/metrics:ro
    networks: [stack]

  verify:
    <<: *hardening
    profiles: [test]
    image: support-bridge-verification:local
    build:
      context: .
      target: verification
    user: "10001:10001"
    working_dir: /app
    command: [verify]
    network_mode: none
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=128m
      - /app/var:rw,nosuid,nodev,size=128m,uid=10001,gid=10001,mode=0700

  smoke:
    <<: *runtime
    profiles: [test]
    command: [smoke]
    environment:
      <<: *application-environment
      BRIDGE_API_TOKEN_FILE: /run/secrets/operator/token
      BRIDGE_METRICS_TOKEN_FILE: /run/secrets/metrics/token
      BRIDGE_GRAFANA_PASSWORD_FILE: /run/secrets/grafana/password
    depends_on:
      api:
        condition: service_healthy
      worker:
        condition: service_healthy
      prometheus:
        condition: service_healthy
      grafana:
        condition: service_healthy
    volumes:
      - app-data:/var/lib/support-bridge:ro
      - operator-secret:/run/secrets/operator:ro
      - metrics-secret:/run/secrets/metrics:ro
      - grafana-secret:/run/secrets/grafana:ro
    networks: [stack]

networks:
  stack:
    driver: bridge

volumes:
  app-data:
  operator-secret:
  metrics-secret:
  grafana-secret:
  prometheus-data:
  grafana-data:
