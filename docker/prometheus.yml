global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: support_bridge
    metrics_path: /metrics
    scrape_timeout: 3s
    follow_redirects: false
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics/token
    static_configs:
      - targets: [api:8080]
