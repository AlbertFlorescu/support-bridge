[paths]
data = /var/lib/grafana
logs = /var/lib/grafana/log
plugins = /opt/grafana/plugins
provisioning = /etc/grafana/provisioning

[server]
http_addr = 0.0.0.0
http_port = 3000
domain = localhost

[security]
admin_user = admin
disable_gravatar = true

[users]
allow_sign_up = false

[auth.anonymous]
enabled = false

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false

[plugins]
preinstall_disabled = true
# Keep only the data sources this deployment uses; prevent missing-plugin downloads.
disable_plugins = cloudwatch,elasticsearch,grafana-postgresql-datasource,grafana-pyroscope-datasource,influxdb,jaeger,loki,mssql,mysql,opentsdb,stackdriver,tempo,zipkin,alertmanager,grafana-azure-monitor-datasource,graphite,grafana-testdata-datasource

[unified_alerting]
enabled = false

[log]
mode = console
