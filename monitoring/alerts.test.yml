  - series: support_bridge_pairs{job="support_bridge",instance="api:8080",status="awaiting_approval"}
    values: 1x8
  - series: support_bridge_intake_records{job="support_bridge",instance="api:8080",status="creating"}
    values: '0x8'
  - series: support_bridge_intake_records{job="support_bridge",instance="api:8080",status="uncertain"}
    values: '0x8'
  - series: support_bridge_intake_records{job="support_bridge",instance="api:8080",status="blocked"}
    values: '0x8'
  - series: support_bridge_comment_deliveries{job="support_bridge",instance="api:8080",status="sending"}
    values: '0x8'
  - series: support_bridge_comment_deliveries{job="support_bridge",instance="api:8080",status="uncertain"}
    values: '0x8'
  - series: support_bridge_comment_deliveries{job="support_bridge",instance="api:8080",status="blocked"}
    values: '0x8'
  - series: support_bridge_comment_stream_errors{job="support_bridge",instance="api:8080"}
    values: '0x8'
  - series: support_bridge_comment_privacy_hold{job="support_bridge",instance="api:8080"}
    values: '0x8'
  - series: up{job="support_bridge",instance="api:8080"}
    values: 1x8
  - series: support_bridge_note_deliveries{job="support_bridge",instance="api:8080",status="sending"}
    values: '0x8'
  - series: support_bridge_note_deliveries{job="support_bridge",instance="api:8080",status="uncertain"}
    values: '0x8'
  - series: support_bridge_note_deliveries{job="support_bridge",instance="api:8080",status="blocked"}
    values: '0x8'
  - series: support_bridge_note_stream_errors{job="support_bridge",instance="api:8080"}
    values: '0x8'
  promql_expr_test:
  - expr: sum(support_bridge_pairs{status=~"conflict|dead|awaiting_approval"}) + sum(support_bridge_intake_records{status=~"creating|uncertain|blocked"}) + sum(support_bridge_comment_deliveries{status=~"sending|uncertain|blocked"})
      + sum(support_bridge_comment_stream_errors) + sum(support_bridge_comment_privacy_hold) + sum(support_bridge_note_deliveries{status=~"sending|uncertain|blocked"})
      + sum(support_bridge_note_stream_errors)
    eval_time: 6m
    exp_samples:
    - labels: '{}'
      value: 1
  alert_rule_test:
  - eval_time: 6m
    alertname: SupportBridgeOperatorAttention
    exp_alerts:
    - exp_labels:
        severity: warning
      exp_annotations: &id001
        summary: Linked work requires an operator decision
        description: Inspect authenticated state; this aggregate carries no record identity or approval.
