name: support-bridge-live-demo

# Select this overlay explicitly; it never imports either local project's state.
x-live-demo-environment: &live-demo-environment
  BRIDGE_MODE: live
  BRIDGE_LIVE_DEMO_ENABLED: "1"
  BRIDGE_HOME: /var/lib/support-bridge
  BRIDGE_GITHUB_REPOSITORY: "${BRIDGE_GITHUB_REPOSITORY:?Set the live demo GitHub repository}"
  BRIDGE_ZENDESK_SUBDOMAIN: "${BRIDGE_ZENDESK_SUBDOMAIN:?Set the live demo Zendesk subdomain}"
  BRIDGE_ZENDESK_AUTH: "${BRIDGE_ZENDESK_AUTH:-oauth}"
  BRIDGE_ZENDESK_EMAIL: "${BRIDGE_ZENDESK_EMAIL:-}"
  BRIDGE_ZENDESK_INTAKE_ENABLED: "${BRIDGE_ZENDESK_INTAKE_ENABLED:-0}"
  BRIDGE_ZENDESK_ESCALATION_TAG: "${BRIDGE_ZENDESK_ESCALATION_TAG:-support_bridge_escalate}"
  BRIDGE_GITHUB_COMMENTS_ENABLED: "${BRIDGE_GITHUB_COMMENTS_ENABLED:-0}"
  BRIDGE_ZENDESK_NOTES_ENABLED: "${BRIDGE_ZENDESK_NOTES_ENABLED:-0}"

x-live-vendor-files: &live-vendor-files
  BRIDGE_GITHUB_TOKEN_FILE: /run/secrets/vendor/github-token
  BRIDGE_ZENDESK_TOKEN_FILE: "${BRIDGE_ZENDESK_TOKEN_FILE-/run/secrets/vendor/zendesk-token}"
  BRIDGE_ZENDESK_OAUTH_BUNDLE_FILE: "${BRIDGE_ZENDESK_OAUTH_BUNDLE_FILE:-}"

x-live-vendor-volumes: &live-vendor-volumes
  - vendor-secret:/run/secrets/vendor:ro

x-oauth-runtime: &oauth-runtime
  image: support-bridge:local
  build:
    context: .
    target: runtime
  user: "10001:10001"
  working_dir: /app
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs:
    - /tmp:rw,nosuid,nodev,size=16m

services:
  # Explicit deployment operation; never mounted into the business state directory.
  credentials:
    profiles: [tools]
    image: support-bridge:local
    build:
      context: .
      target: runtime
    user: "10001:10001"
    working_dir: /app
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=16m
    network_mode: none
    stdin_open: true
    entrypoint: [php, /app/docker/import-vendor-credentials.php]
    environment:
      BRIDGE_MODE: live
      BRIDGE_LIVE_DEMO_ENABLED: "1"
    volumes:
      - vendor-secret:/var/lib/support-bridge
    restart: "no"

  oauth-credentials:
    <<: *oauth-runtime
    profiles: [tools]
    network_mode: none
    stdin_open: true
    entrypoint: [php, /app/docker/import-oauth-credentials.php]
    environment:
      BRIDGE_MODE: live
      BRIDGE_LIVE_DEMO_ENABLED: "1"
      BRIDGE_ZENDESK_SUBDOMAIN: "${BRIDGE_ZENDESK_SUBDOMAIN:?Set the live demo Zendesk subdomain}"
      BRIDGE_OAUTH_DIRECTORY: /var/lib/support-bridge
    volumes:
      - issuer-secret:/var/lib/support-bridge
    restart: "no"

  zendesk-token-renewer:
    <<: *oauth-runtime
    profiles: [oauth-renewal]
    entrypoint: [php, /app/docker/renew-zendesk-token.php]
    environment:
      BRIDGE_MODE: live
      BRIDGE_LIVE_DEMO_ENABLED: "1"
      BRIDGE_ZENDESK_SUBDOMAIN: "${BRIDGE_ZENDESK_SUBDOMAIN:?Set the live demo Zendesk subdomain}"
      BRIDGE_OAUTH_CLIENT_FILE: /run/secrets/oauth/client.json
      BRIDGE_OAUTH_DIRECTORY: /var/lib/support-bridge
    volumes:
      - issuer-secret:/run/secrets/oauth:ro
      - vendor-secret:/var/lib/support-bridge
    networks: [stack]
    restart: unless-stopped
    stop_grace_period: 15s
    healthcheck:
      test: [CMD, php, /app/docker/healthcheck-oauth.php]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  init:
    command: [live-init]
    environment: *live-demo-environment

  api:
    ports: !override
      - "127.0.0.1:${BRIDGE_LIVE_HTTP_PORT:-1988}:8080"
    environment:
      <<: [*live-demo-environment, *live-vendor-files]
    volumes: *live-vendor-volumes

  worker:
    profiles: [live-worker]
    environment:
      <<: [*live-demo-environment, *live-vendor-files]
      BRIDGE_SWEEP_INTERVAL: "${BRIDGE_LIVE_SWEEP_INTERVAL:-60}"
    volumes: *live-vendor-volumes

  cli:
    environment:
      <<: [*live-demo-environment, *live-vendor-files]
    volumes: *live-vendor-volumes

  prometheus:
    ports: !override
      - "127.0.0.1:${BRIDGE_LIVE_PROMETHEUS_PORT:-1989}:9090"

  grafana:
    ports: !override
      - "127.0.0.1:${BRIDGE_LIVE_GRAFANA_PORT:-1990}:3000"

  # Read-only verification can run after explicit links exist; it never enables the worker.
  # Its Grafana authentication still assumes the generated bootstrap account.
  smoke:
    environment: *live-demo-environment
    depends_on: !override
      api:
        condition: service_healthy
      prometheus:
        condition: service_healthy
      grafana:
        condition: service_healthy

volumes:
  vendor-secret:
  issuer-secret:
